<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2ef"><title>KOKEI Grain Founder Blind</title><style>:root{--bg:#f2f2ef;--fg:#11110f;--muted:#74746f;--line:#d8d8d2;--surface:#fbfbf8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}main{max-width:820px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 8px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;gap:12px;padding:0 4px 10px}h1{font-size:17px;margin:0}.meta,.small{font-size:10.5px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}.lead{font-size:13px;line-height:1.55;margin:0}.stageWrap{background:#d5d5d1;border-radius:12px;overflow:auto;min-height:46svh;display:grid;place-items:center;position:relative}.stage{display:block;max-width:100%;max-height:calc(100svh - 285px);object-fit:contain}.stage.hundred{max-width:none;max-height:none;width:auto;height:auto}.toolbar,.choice,.conf,.reasons{display:grid;gap:6px;margin-top:8px}.toolbar{grid-template-columns:repeat(2,1fr)}.choice{grid-template-columns:1fr 1fr 1.35fr}.conf{grid-template-columns:repeat(3,1fr)}.reasons{grid-template-columns:repeat(3,1fr)}button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:42px;font-size:12px;font-weight:680;padding:7px;color:#111}.active{background:#111;color:#fff;border-color:#111}.q{font-size:12px;font-weight:720;margin:11px 0 0}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.out{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:10px;line-height:1.45;display:none}.err{display:none;color:#8b1c1c;font-size:12px;line-height:1.4;margin-top:8px}@media(max-width:620px){.reasons{grid-template-columns:repeat(2,1fr)}.meta{display:none}}</style></head><body><main><header><h1>KOKEI — Grain Founder Blind</h1><div class="meta">R&D · EXP-EG-039I · primary pair gate</div></header><section class="panel"><p class="lead">兩組正式 Grain A/B 盲測。每組都看 Fit 與 100%；若真的沒有可靠差異，請直接選「分不出可靠差異」。A/B mapping 已在 Founder review 前封存，頁面不包含 q0/q1 標籤。</p></section><section class="panel"><div class="small" id="pairMeta">Pair 1 / 2</div><div class="stageWrap"><img id="stage" class="stage" alt="Grain blind candidate"></div><div id="err" class="err">影像載入失敗。這代表測試面無效，請不要作答並回報 R&D。</div><div class="toolbar"><button id="a" class="active">A</button><button id="b">B</button></div><div class="toolbar"><button id="fit" class="active">Fit</button><button id="hundred">100%</button></div><div class="q">哪一個 Grain 更像影像本身的材質？</div><div class="choice"><button data-choice="A">A 較好</button><button data-choice="B">B 較好</button><button data-choice="same">分不出可靠差異</button></div><div class="q">信心程度</div><div class="conf"><button data-conf="low">低</button><button data-conf="medium">中</button><button data-conf="high">高</button></div><div class="q">主要觀感／失敗感（可複選）</div><div class="reasons"><button data-r="natural">材質自然</button><button data-r="overlay">像覆蓋雜訊</button><button data-r="mushy">糊／悶</button><button data-r="sand">沙／躁</button><button data-r="detail">搶細節</button><button data-r="mottle">低頻髒感</button><button data-r="size">顆粒尺度</button><button data-r="amount">顆粒強度</button><button data-r="cannot-tell">看不出</button></div><div class="nav"><button id="prev">上一組</button><button id="next">下一組</button></div></section><pre id="out" class="out"></pre></main><script>'use strict';const V='KQ-GRAIN-039I-PRIMARY-v0.3';const P=[{id:'P1',label:'structure/detail',A:'/grain-assets/P1_A.webp',B:'/grain-assets/P1_B.webp'},{id:'P2',label:'smooth/mottle',A:'/grain-assets/P2_A.webp',B:'/grain-assets/P2_B.webp'}];const $=id=>document.getElementById(id),stage=$('stage'),meta=$('pairMeta'),out=$('out'),err=$('err');let i=0,view='A',ans=P.map(()=>({choice:null,confidence:null,reasons:[]}));function setActive(sel,node){document.querySelectorAll(sel).forEach(x=>x.classList.toggle('active',x===node))}function show(v){view=v;err.style.display='none';stage.src=P[i][v];$('a').classList.toggle('active',v==='A');$('b').classList.toggle('active',v==='B')}function setZoom(z){stage.classList.toggle('hundred',z==='100');$('fit').classList.toggle('active',z==='fit');$('hundred').classList.toggle('active',z==='100')}function render(){meta.textContent=`Pair ${i+1} / ${P.length} · ${P[i].label}`;show('A');setZoom('fit');document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('active',b.dataset.choice===ans[i].choice));document.querySelectorAll('[data-conf]').forEach(b=>b.classList.toggle('active',b.dataset.conf===ans[i].confidence));document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',ans[i].reasons.includes(b.dataset.r)));$('prev').disabled=i===0;$('next').textContent=i===P.length-1?'完成並輸出 JSON':'下一組'}$('a').onclick=()=>show('A');$('b').onclick=()=>show('B');$('fit').onclick=()=>setZoom('fit');$('hundred').onclick=()=>setZoom('100');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{ans[i].choice=b.dataset.choice;setActive('[data-choice]',b)});document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{ans[i].confidence=b.dataset.conf;setActive('[data-conf]',b)});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r,a=ans[i];a.reasons=a.reasons.includes(r)?a.reasons.filter(x=>x!==r):[...a.reasons,r];b.classList.toggle('active',a.reasons.includes(r))});$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(!ans[i].choice||!ans[i].confidence){alert('請先選擇判斷與信心程度。');return}if(i<P.length-1){i++;render();return}const rec={version:V,completedAt:new Date().toISOString(),viewport:{innerWidth,innerHeight,dpr:devicePixelRatio||1},pairs:P.map((p,j)=>({pair:p.id,label:p.label,...ans[j]}))};localStorage.setItem('kokei_grain_039i_founder_result',JSON.stringify(rec));out.style.display='block';out.textContent=JSON.stringify(rec,null,2);out.scrollIntoView({behavior:'smooth'});navigator.clipboard?.writeText(JSON.stringify(rec,null,2)).catch(()=>{})};stage.onerror=()=>{err.style.display='block'};render();</script></body></html>
