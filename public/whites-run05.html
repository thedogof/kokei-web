<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2ef">
<title>KOKEI Whites RUN05 Founder Blind</title>
<style>
:root{--bg:#f2f2ef;--fg:#11110f;--muted:#73736d;--line:#d7d7d1;--surface:#fbfbf8;--bad:#9b342c;--ok:#1f6b45}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}main{max-width:820px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 8px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;gap:10px;padding:0 3px 10px}h1{font-size:17px;margin:0}.meta,.small{font-size:10.5px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px}.lead{font-size:13px;line-height:1.55;margin:0}.status{font-size:11px;line-height:1.45;color:var(--muted);white-space:pre-wrap;word-break:break-word}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.stageWrap{background:#d4d4cf;border-radius:12px;overflow:auto;min-height:48svh;display:grid;place-items:center;position:relative}.stage{display:block;max-width:100%;max-height:calc(100svh - 320px);width:auto;height:auto;background:#fff}.stage.hundred{max-width:none;max-height:none}.toolbar,.choice,.conf{display:grid;gap:6px;margin-top:8px}.toolbar.views{grid-template-columns:repeat(3,1fr)}.toolbar.zoom{grid-template-columns:repeat(3,1fr)}.choice{grid-template-columns:1fr 1fr 1.35fr}.conf{grid-template-columns:repeat(3,1fr)}button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:42px;font-size:12px;font-weight:680;padding:7px;color:#111}.active{background:#111;color:#fff;border-color:#111}.q{font-size:12px;font-weight:720;margin:11px 0 0}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.out{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:10px;line-height:1.45;display:none}.fatal{display:none;color:var(--bad);font-size:12px;font-weight:700;line-height:1.45}.locked{opacity:.42;pointer-events:none}.sceneMeta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:7px}@media(max-width:620px){.meta{display:none}.choice button{font-size:11.5px}.stageWrap{min-height:46svh}}
</style>
</head>
<body><main>
<header><h1>KOKEI — Whites RUN05</h1><div class="meta">EXP-TONE-001 · Founder blind · v0.1</div></header>
<section class="panel"><p class="lead">Whites agency / perceptibility gate。三個場景都先看 SOURCE，再比較 A / B。可切 Fit / 100%；若沒有可靠差異，直接選「分不出可靠差異」。A/B private mapping 不存在於此頁。</p></section>
<section class="panel"><div id="preflight" class="status">Preflight：尚未完成。</div><div id="fatal" class="fatal">資產完整性或解碼驗證失敗。此測試面 INVALID，作答已鎖定。請回報 R&D，不要作任何視覺判斷。</div></section>
<section class="panel" id="gate"><div class="sceneMeta"><span id="sceneMeta">Scene 1 / 3</span><span id="sceneLabel"></span></div><div class="stageWrap"><canvas id="stage" class="stage"></canvas></div><div class="toolbar views"><button data-view="SOURCE">SOURCE</button><button data-view="A" class="active">A</button><button data-view="B">B</button></div><div class="toolbar zoom"><button data-zoom="fit" class="active">Fit</button><button data-zoom="100">100%</button><button data-detail="toggle">Detail crop</button></div><div class="q">哪一個 Whites 行為比較適合這張照片？</div><div class="choice"><button data-choice="A">A 較好</button><button data-choice="B">B 較好</button><button data-choice="same">分不出可靠差異</button></div><div class="q">信心程度</div><div class="conf"><button data-conf="low">低</button><button data-conf="medium">中</button><button data-conf="high">高</button></div><div class="nav"><button id="prev">上一張</button><button id="next">下一張</button></div></section>
<pre id="out" class="out"></pre>
</main>
<script>
'use strict';
const VERSION='KQ-WHITES-RUN05-v0.1';
const ASSETS=[
 {id:'S1',label:'high-white stress',url:'/whites-run05-assets/scene1.png',bytes:4528886,sha:'08e2ae12ac5942704f7aa970cc64c7ee23cc7c7cda0d0355e06df75dfc7e1d6e'},
 {id:'S2',label:'mid near-white',url:'/whites-run05-assets/scene2.png',bytes:2763120,sha:'679bc0bf3abd788ac008ac248ce3ff7832644c344485a2b52f80008bc3f53ace'},
 {id:'S3',label:'dark negative control',url:'/whites-run05-assets/scene3.png',bytes:2350774,sha:'a40037373bfe222add107c640043c501ff981178a4585c4508455404c3102c14'}
];
const $=id=>document.getElementById(id),stage=$('stage'),ctx=stage.getContext('2d'),gate=$('gate'),preflight=$('preflight'),fatal=$('fatal'),out=$('out');
let i=0,view='A',zoom='fit',detail=false,valid=false,decoded=[],ans=ASSETS.map(()=>({choice:null,confidence:null}));
const enc=h=>[...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('');
async function verifyAsset(a){const r=await fetch(a.url,{cache:'no-store'});if(!r.ok)throw new Error(`${a.id} HTTP ${r.status}`);const b=await r.arrayBuffer();if(b.byteLength!==a.bytes)throw new Error(`${a.id} byte length ${b.byteLength} != ${a.bytes}`);const h=enc(await crypto.subtle.digest('SHA-256',b));if(h!==a.sha)throw new Error(`${a.id} SHA-256 mismatch`);const blob=new Blob([b],{type:'image/png'}),bmp=await createImageBitmap(blob);if(!bmp.width||!bmp.height)throw new Error(`${a.id} decode failed`);return bmp}
async function preflightAll(){gate.classList.add('locked');try{preflight.textContent='Preflight：正在驗證 3/3 same-origin assets…';decoded=[];for(let n=0;n<ASSETS.length;n++){preflight.textContent=`Preflight：${n+1}/3 · byte length → SHA-256 → browser decode`;decoded.push(await verifyAsset(ASSETS[n]))}valid=true;gate.classList.remove('locked');preflight.className='status ok';preflight.textContent=`PASS · 3/3 assets integrity + decode verified\nHarness ${VERSION} · viewport ${innerWidth}×${innerHeight} CSS · DPR ${devicePixelRatio||1}`;render()}catch(e){valid=false;fatal.style.display='block';preflight.className='status bad';preflight.textContent='FAIL · '+e.message;gate.classList.add('locked')}}
function cropFor(v,isDetail,bmp){const col={SOURCE:0,A:1,B:2}[v],cw=Math.floor(bmp.width/3),topY=54,splitY=Math.floor(bmp.height*.505),bottomY=splitY+14;if(!isDetail)return{sx:col*cw,sy:topY,sw:col===2?bmp.width-col*cw:cw,sh:splitY-topY};return{sx:col*cw,sy:bottomY,sw:col===2?bmp.width-col*cw:cw,sh:bmp.height-bottomY-22}}
function render(){if(!valid)return;const bmp=decoded[i],c=cropFor(view,detail,bmp);stage.width=c.sw;stage.height=c.sh;ctx.clearRect(0,0,stage.width,stage.height);ctx.drawImage(bmp,c.sx,c.sy,c.sw,c.sh,0,0,c.sw,c.sh);stage.classList.toggle('hundred',zoom==='100');$('sceneMeta').textContent=`Scene ${i+1} / ${ASSETS.length}`;$('sceneLabel').textContent=ASSETS[i].label;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-zoom]').forEach(b=>b.classList.toggle('active',b.dataset.zoom===zoom));document.querySelector('[data-detail]').classList.toggle('active',detail);document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('active',b.dataset.choice===ans[i].choice));document.querySelectorAll('[data-conf]').forEach(b=>b.classList.toggle('active',b.dataset.conf===ans[i].confidence));$('prev').disabled=i===0;$('next').textContent=i===ASSETS.length-1?'完成並輸出 JSON':'下一張'}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=b.dataset.zoom;render()});document.querySelector('[data-detail]').onclick=()=>{detail=!detail;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{ans[i].choice=b.dataset.choice;render()});document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{ans[i].confidence=b.dataset.conf;render()});$('prev').onclick=()=>{if(i>0){i--;view='A';zoom='fit';detail=false;render()}};$('next').onclick=()=>{if(!valid)return;if(!ans[i].choice||!ans[i].confidence){alert('請先選擇判斷與信心程度。');return}if(i<ASSETS.length-1){i++;view='A';zoom='fit';detail=false;render();return}const rec={version:VERSION,completedAt:new Date().toISOString(),integrity:'PASS',viewport:{innerWidth,innerHeight,dpr:devicePixelRatio||1,userAgent:navigator.userAgent},assets:ASSETS.map(({id,label,bytes,sha})=>({id,label,bytes,sha})),scenes:ASSETS.map((a,j)=>({scene:a.id,label:a.label,...ans[j]}))};localStorage.setItem('kokei_whites_run05_founder_result',JSON.stringify(rec));out.style.display='block';out.textContent=JSON.stringify(rec,null,2);out.scrollIntoView({behavior:'smooth'});navigator.clipboard?.writeText(JSON.stringify(rec,null,2)).catch(()=>{})};
preflightAll();
</script></body></html>
