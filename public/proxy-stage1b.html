<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2ef">
<title>KOKEI Tone Proxy Validation</title>
<style>
:root{--bg:#f2f2ef;--fg:#11110f;--muted:#74746f;--line:#d9d9d3;--surface:#fbfbf8;--good:#1f6b45;--bad:#9b342c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{overscroll-behavior-y:none}main{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom))}header{padding:0 10px 10px;display:flex;justify-content:space-between;align-items:end;gap:10px}h1{font-size:17px;margin:0;font-weight:720;letter-spacing:-.015em}.meta{font-size:10px;color:var(--muted)}.panel{margin:0 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px}.scene{font-size:12px;font-weight:720;margin-bottom:4px}.prompt{font-size:14px;font-weight:700;line-height:1.4;margin:0 0 7px}.small{font-size:10.5px;line-height:1.5;color:var(--muted)}.file{display:block;width:100%;font-size:13px;color:#111;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;min-height:48px;margin-top:10px}.file::file-selector-button{appearance:none;border:0;background:#111;color:#fff;border-radius:8px;padding:10px 12px;margin-right:9px;font-weight:680}.status{font-size:11px;line-height:1.5;color:var(--muted);margin-top:8px;word-break:break-word}.status.ok{color:var(--good)}.status.bad{color:var(--bad)}.stageWrap{display:none;position:relative;width:100%;place-items:center;background:#d3d3cf;overflow:hidden}.stageWrap.active{display:grid}.stage{display:block;background:#111;max-width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:6px 8px;background:rgba(0,0,0,.34);color:#fff;border-radius:99px;font-size:10px;white-space:nowrap;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,20,19,.91);color:#fff;text-align:center;font-size:12px;line-height:1.5;padding:24px;z-index:4}.loading[hidden]{display:none}.trial{display:none;padding:10px 8px}.trial.active{display:block}.trialTop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px;font-size:11px}.trialId{color:var(--muted)}.ab{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ab button,.choice button,.confidence button,.reason button,.btn{appearance:none;border:1px solid var(--line);background:#fff;color:#111;border-radius:10px;min-height:44px;font-size:13px;font-weight:680;padding:8px}.ab button.active,.choice button.active,.confidence button.active,.reason button.active{background:#111;color:#fff;border-color:#111}.question{font-size:12px;font-weight:720;margin:11px 0 6px}.choice{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px}.confidence{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.reason{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.reason button{font-size:11px;min-height:38px;padding:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.btn.primary{background:#111;color:#fff;border-color:#111}.btn:disabled{opacity:.38}.results{display:none;margin:8px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px}.results.active{display:block}.results h2{font-size:15px;margin:0 0 8px}.results pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f1;border-radius:9px;padding:9px;font-size:10.5px;line-height:1.5;margin:0 0 8px}@media(max-width:620px){.meta{display:none}.reason{grid-template-columns:repeat(4,1fr)}.choice button{font-size:12px}}
</style>
</head>
<body><main>
<header><h1>KOKEI — Tone Proxy Gate</h1><div class="meta">Stage 1B · 1.0× vs 1.5× · v0.4</div></header>
<section class="panel" id="intake">
<div class="scene" id="sceneLabel"></div>
<p class="prompt" id="scenePrompt"></p>
<div class="small" id="sceneHelp"></div>
<input class="file" id="file" type="file" accept="image/*">
<div class="status" id="status">等待照片。照片只在這台裝置的瀏覽器記憶體處理，不上傳。</div>
</section>
<section class="stageWrap" id="stageWrap"><canvas class="stage" id="stage" aria-label="A/B 盲測影像"></canvas><div class="hint">點 A / B，或左右滑動切換</div><div class="loading" id="loading" hidden>建立 1.0× / 1.5× 盲測影像中…</div></section>
<section class="trial" id="trial">
<div class="trialTop"><div class="trialId" id="trialId"></div><div id="progress"></div></div>
<div class="ab"><button id="viewA" class="active">A</button><button id="viewB">B</button></div>
<div class="question">你實際看到的品質？</div>
<div class="choice"><button data-choice="A">A 較好</button><button data-choice="B">B 較好</button><button data-choice="same">分不出可靠差異</button></div>
<div class="question">信心程度</div>
<div class="confidence"><button data-confidence="low">低</button><button data-confidence="medium">中</button><button data-confidence="high">高</button></div>
<div class="question">差異主要在哪裡？（可不選）</div>
<div class="reason"><button data-reason="tone">明暗</button><button data-reason="smoothness">平滑度</button><button data-reason="detail">細節</button><button data-reason="color">色彩</button><button data-reason="edge">邊緣</button><button data-reason="texture">紋理</button><button data-reason="other">其他</button><button data-reason="cannot-tell">看不出</button></div>
<div class="actions"><button class="btn" id="reselect">重選照片</button><button class="btn primary" id="finish" disabled>記錄這張</button></div>
</section>
<section class="results" id="results"><h2 id="resultTitle"></h2><pre id="summary"></pre><div class="actions"><button class="btn" id="resetAll">重新開始</button><button class="btn primary" id="copy">複製完整 QA 紀錄</button></div></section>
</main>
<script>
'use strict';
const VERSION='KQ-PROXY-TONE-STAGE1B-v0.4';
const TARGET_POLICY='full-width viewport fit; height budget innerHeight-170 CSS px';
const SCENES=[
 {name:'膚色／人像',help:'優先選有皮膚、中間調、細微明暗過渡的照片。'},
 {name:'天空／牆面／平滑漸層',help:'優先選大面積平滑色階、天空、牆面或柔和光影。'},
 {name:'葉片／自然紋理',help:'優先選葉片、草木、自然細節或密集但非人工銳化的紋理。'},
 {name:'高對比邊界／幾何線條',help:'優先選窗框、建築、文字邊緣、亮暗交界或規律線條。'}
];
const $=id=>document.getElementById(id),file=$('file'),statusEl=$('status'),stageWrap=$('stageWrap'),stage=$('stage'),loading=$('loading'),trialBox=$('trial'),results=$('results'),summary=$('summary');
let sceneIndex=Number(localStorage.getItem('kq_tone_stage1b_scene')||'0'); if(sceneIndex<0||sceneIndex>3)sceneIndex=0;
let srcImg=null,srcMeta=null,target=null,candidates=null,trial=null,answer={},touchX=null,sceneRecord=null;
const K=[[0,0,0],[.05,-.07491,.02536],[.10,-.13502,.04548],[.20,-.17845,.05849],[.30,-.05341,.01793],[.34,-.01299,.00069],[.50,.29576,-.09898],[.70,.32873,-.11422],[.85,.19793,-.07050],[.95,.06655,-.02853],[1,0,0]],xs=K.map(k=>k[0]),yp=K.map(k=>k[1]),yn=K.map(k=>k[2]);
function slopes(y){const n=xs.length,h=[],d=[],m=new Array(n).fill(0);for(let i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(y[i+1]-y[i])/h[i]}m[0]=((2*h[0]+h[1])*d[0]-h[0]*d[1])/(h[0]+h[1]);if(Math.sign(m[0])!==Math.sign(d[0]))m[0]=0;for(let i=1;i<n-1;i++){if(!d[i-1]||!d[i]||Math.sign(d[i-1])!==Math.sign(d[i]))m[i]=0;else{const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}}const q=n-1;m[q]=((2*h[q-1]+h[q-2])*d[q-1]-h[q-1]*d[q-2])/(h[q-1]+h[q-2]);if(Math.sign(m[q])!==Math.sign(d[q-1]))m[q]=0;return m}const mp=slopes(yp),mn=slopes(yn);
function pc(x,y,m){x=Math.min(1,Math.max(0,x));let i=xs.length-2;for(let j=0;j<xs.length-1;j++)if(x<=xs[j+1]){i=j;break}const h=xs[i+1]-xs[i],t=(x-xs[i])/h,t2=t*t,t3=t2*t;return(2*t3-3*t2+1)*y[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*y[i+1]+(t3-t2)*h*m[i+1]}
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function basis(x,positive){let b=positive?pc(x,yp,mp):pc(x,yn,mn);if(positive&&x<.34)b*=.58+.42*smooth(x/.34);return b}function transform(x,dose){if(!dose)return x;return Math.max(0,Math.min(1,x+Math.abs(dose)*basis(x,dose>=0)))}
const UI_VALUE=50,DOSE=.25;
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}function smoothCtx(x){x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high'}
function processContrast(c){const x=c.getContext('2d',{willReadFrequently:true}),im=x.getImageData(0,0,c.width,c.height),d=im.data,N=2048,lut=new Float32Array(N);for(let i=0;i<N;i++)lut[i]=transform(i/(N-1),DOSE);for(let i=0;i<d.length;i+=4){const y=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255,yy=lut[Math.max(0,Math.min(N-1,Math.round(y*(N-1))))];if(y<1e-6){const q=Math.round(yy*255);d[i]=d[i+1]=d[i+2]=q;continue}const sc=yy/y;d[i]=Math.max(0,Math.min(255,Math.round(d[i]*sc)));d[i+1]=Math.max(0,Math.min(255,Math.round(d[i+1]*sc)));d[i+2]=Math.max(0,Math.min(255,Math.round(d[i+2]*sc)))}x.putImageData(im,0,0)}
async function sha256(f){try{const b=await f.arrayBuffer(),h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
function targetRect(sw,sh){const cssMaxW=Math.min(document.documentElement.clientWidth,760),cssMaxH=Math.max(240,innerHeight-170),r=sw/sh;let w=cssMaxW,h=w/r;if(h>cssMaxH){h=cssMaxH;w=h*r}const dpr=devicePixelRatio||1;return{cssW:Math.max(1,Math.round(w)),cssH:Math.max(1,Math.round(h)),pxW:Math.max(1,Math.round(w*dpr)),pxH:Math.max(1,Math.round(h*dpr)),dpr}}
function proxySize(kind,t){const m=kind==='p1'?1:1.5;return{w:Math.round(t.pxW*m),h:Math.round(t.pxH*m)}}
async function renderCandidate(kind){const s=proxySize(kind,target),c=canvas(s.w,s.h),x=c.getContext('2d');smoothCtx(x);const t0=performance.now();x.drawImage(srcImg,0,0,s.w,s.h);processContrast(c);const out=canvas(target.pxW,target.pxH),ox=out.getContext('2d');smoothCtx(ox);ox.drawImage(c,0,0,target.pxW,target.pxH);return{canvas:out,proxy:s,renderMs:performance.now()-t0,approxRGBABytes:s.w*s.h*4}}
function randomSide(){const a=new Uint32Array(1);crypto.getRandomValues(a);return(a[0]&1)?'A':'B'}
function setSceneText(){$('sceneLabel').textContent=`場景 ${sceneIndex+1} / 4`;$('scenePrompt').textContent=SCENES[sceneIndex].name;$('sceneHelp').textContent=SCENES[sceneIndex].help;$('progress').textContent=`${sceneIndex+1} / 4`}
function setStatus(s,cls=''){statusEl.textContent=s;statusEl.className='status '+cls}
function showSide(side){$('viewA').classList.toggle('active',side==='A');$('viewB').classList.toggle('active',side==='B');const key=trial.map[side],src=candidates[key].canvas,x=stage.getContext('2d');x.clearRect(0,0,stage.width,stage.height);x.drawImage(src,0,0)}
function refreshAnswer(){document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('active',b.dataset.choice===answer.choice));document.querySelectorAll('[data-confidence]').forEach(b=>b.classList.toggle('active',b.dataset.confidence===answer.confidence));document.querySelectorAll('[data-reason]').forEach(b=>b.classList.toggle('active',b.dataset.reason===answer.reason));$('finish').disabled=!(answer.choice&&answer.confidence)}
function field(k,v){answer[k]=v;refreshAnswer()}
function allResults(){const arr=[];for(let i=0;i<4;i++){const s=localStorage.getItem(`kq_tone_stage1b_result_${i}`);if(s)arr.push(JSON.parse(s))}return arr}
function qaRecord(){return{version:VERSION,targetPolicy:TARGET_POLICY,timestamp:new Date().toISOString(),scene:sceneIndex+1,sceneType:SCENES[sceneIndex].name,source:srcMeta,target,operator:{module:'C2-CO Contrast Playground v0.3.3',mode:'C',ui:UI_VALUE,dose:DOSE,rgbGuard:false,colorPath:'browser Canvas decoded RGB; identical across candidates; SDR spatial gate only'},resampling:'Canvas drawImage, imageSmoothingQuality=high',trial:{id:trial.id,hiddenMap:trial.map,answer},renders:Object.fromEntries(Object.entries(candidates).map(([k,v])=>[k,{proxy:v.proxy,renderMs:+v.renderMs.toFixed(2),approxRGBABytes:v.approxRGBABytes}])),limits:{peakMemory:'not available from browser',thermalState:'not available from browser',P3HDR:'not tested',productionNativeParity:'not established'}}}
async function prepare(f){loading.hidden=false;results.classList.remove('active');trialBox.classList.remove('active');stageWrap.classList.remove('active');setStatus('收到檔案，正在解碼…');const url=URL.createObjectURL(f);try{const img=new Image();img.decoding='async';await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Image decode failed'));img.src=url});srcImg=img;srcMeta={name:f.name,type:f.type||'unknown',bytes:f.size,width:img.naturalWidth,height:img.naturalHeight,sha256:'計算中'};target=targetRect(srcMeta.width,srcMeta.height);const reqW=Math.ceil(target.pxW*1.5),reqH=Math.ceil(target.pxH*1.5);if(srcMeta.width<reqW||srcMeta.height<reqH)throw new Error(`來源解析度不足 1.5× reference：至少需要 ${reqW}×${reqH}，目前 ${srcMeta.width}×${srcMeta.height}`);stage.width=target.pxW;stage.height=target.pxH;stage.style.width=target.cssW+'px';stage.style.height=target.cssH+'px';stageWrap.style.minHeight=Math.max(target.cssH,220)+'px';stageWrap.classList.add('active');const hashP=sha256(f);candidates={};for(const k of ['p1','p3']){loading.textContent=`建立 ${k==='p1'?'1.0×':'1.5×'} 候選…`;candidates[k]=await renderCandidate(k);await new Promise(r=>setTimeout(r,0))}srcMeta.sha256=await hashP||'unavailable';const refSide=randomSide(),candSide=refSide==='A'?'B':'A';trial={id:`R3-S${sceneIndex+1}-${Date.now().toString(36)}`,map:{[refSide]:'p3',[candSide]:'p1'}};localStorage.setItem(`kq_tone_stage1b_key_${sceneIndex}`,JSON.stringify({id:trial.id,map:trial.map}));answer={};$('trialId').textContent=trial.id;trialBox.classList.add('active');showSide('A');refreshAnswer();setStatus(`Ready · 畫布 ${target.pxW}×${target.pxH}px · SHA-256 ${srcMeta.sha256.slice(0,12)}…`,'ok')}catch(e){setStatus('FAILED · '+e.message,'bad');stageWrap.classList.remove('active');trialBox.classList.remove('active')}finally{URL.revokeObjectURL(url);loading.hidden=true}}
function finishScene(){sceneRecord=qaRecord();localStorage.setItem(`kq_tone_stage1b_result_${sceneIndex}`,JSON.stringify(sceneRecord));trialBox.classList.remove('active');stageWrap.classList.remove('active');if(sceneIndex<3){sceneIndex++;localStorage.setItem('kq_tone_stage1b_scene',String(sceneIndex));file.value='';setSceneText();setStatus('上一張已記錄。請選下一類照片。','ok');window.scrollTo({top:0,behavior:'smooth'})}else{localStorage.setItem('kq_tone_stage1b_scene','0');showResults()}}
function showResults(){results.classList.add('active');const recs=allResults();$('resultTitle').textContent='四個場景完成';summary.textContent=recs.map(r=>`場景 ${r.scene} · ${r.sceneType}\n${r.trial.id}: ${r.trial.answer.choice} / 信心 ${r.trial.answer.confidence}${r.trial.answer.reason?` / ${r.trial.answer.reason}`:''}\nTarget ${r.target.pxW}×${r.target.pxH}px`).join('\n\n')}
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(f)prepare(f)});$('viewA').onclick=()=>showSide('A');$('viewB').onclick=()=>showSide('B');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>field('choice',b.dataset.choice));document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>field('confidence',b.dataset.confidence));document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>field('reason',b.dataset.reason));$('finish').onclick=finishScene;$('reselect').onclick=()=>{file.value='';file.click()};$('copy').onclick=async()=>{const payload=JSON.stringify({test:'KOKEI Proxy Stage1B Tone 1.0x vs 1.5x',version:VERSION,results:allResults()},null,2);try{await navigator.clipboard.writeText(payload);$('copy').textContent='已複製 QA 紀錄'}catch(e){prompt('請複製以下紀錄',payload)}};$('resetAll').onclick=()=>{for(let i=0;i<4;i++){localStorage.removeItem(`kq_tone_stage1b_result_${i}`);localStorage.removeItem(`kq_tone_stage1b_key_${i}`)}localStorage.setItem('kq_tone_stage1b_scene','0');location.reload()};stage.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(touchX==null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>35)showSide(dx<0?'B':'A')},{passive:true});
setSceneText();
</script></body></html>
