<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2ef">
<title>KOKEI Proxy Preview Blind Test v0.1</title>
<style>
:root{--bg:#f2f2ef;--fg:#11110f;--muted:#75756f;--line:#d7d7d1;--panel:#fbfbf8;--light:#d2d2cf;--dark:#1f1f1e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{overscroll-behavior-y:none}main{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom))}header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 12px 10px}h1{font-size:17px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}.meta{font-size:10px;color:var(--muted);white-space:nowrap}.stageWrap{position:relative;width:100%;min-height:62svh;display:grid;place-items:center;background:var(--light);transition:background .12s linear;overflow:hidden}.stageWrap.dark{background:var(--dark)}#stage{display:block;width:100%;height:auto;background:#111;touch-action:pan-y;user-select:none;-webkit-user-select:none}.stageHint{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;line-height:1;color:rgba(255,255,255,.74);background:rgba(0,0,0,.32);backdrop-filter:blur(8px);padding:6px 8px;border-radius:99px;pointer-events:none;white-space:nowrap}.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(17,17,15,.90);color:#fff;font-size:13px;line-height:1.5;z-index:5}.loading[hidden]{display:none}.controls{padding:12px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.condition{font-size:12px;font-weight:700}.progress{font-size:11px;color:var(--muted)}.switcher{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.viewBtn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:11px;min-height:48px;font-size:14px;font-weight:700;color:#111}.viewBtn.active{background:#111;color:#fff;border-color:#111}.question{font-size:12px;font-weight:700;margin:3px 0 8px}.answerGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ans{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:42px;font-size:12px;font-weight:680;color:#111;padding:7px 4px}.ans.active{background:#111;color:#fff;border-color:#111}.ans.none{font-size:11px;line-height:1.05}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:#111;border-radius:10px;min-height:44px;padding:9px 12px;font-size:13px;font-weight:650}.btn.primary{background:#111;color:#fff;border-color:#111}.btn:disabled{opacity:.38}.note{font-size:10.5px;line-height:1.55;color:var(--muted);padding:11px 12px 0;border-top:1px solid #e1e1dc;margin-top:3px}.results{margin:12px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.results[hidden]{display:none}.results h2{font-size:15px;margin:0 0 8px}.results pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f1;border-radius:9px;padding:10px;font-size:11px;line-height:1.55;margin:0 0 8px}.small{font-size:10px;color:var(--muted);line-height:1.45}@media(max-width:620px){header{padding-left:10px;padding-right:10px}.meta{display:none}.controls{padding:10px}.stageWrap{min-height:58svh}.viewBtn{min-height:50px}.answerGrid{grid-template-columns:repeat(5,1fr);gap:5px}.ans{padding-left:2px;padding-right:2px}}</style>
</head>
<body><main>
<header><h1>KOKEI — Proxy Preview Blind Test</h1><div class="meta">Round 1 · v0.1 · SDR / sRGB spatial gate</div></header>
<section class="stageWrap" id="stageWrap"><canvas id="stage" aria-label="盲測影像"></canvas><div class="stageHint">左右滑動切換 A / B / C / D</div><div class="loading" id="loading">正在依這台裝置的實際顯示像素建立盲測…<br>第一次約需幾秒。</div></section>
<section class="controls" id="controls"><div class="topline"><div class="condition" id="condition">Tone · Light</div><div class="progress" id="progress">1 / 4</div></div><div class="switcher"><button class="viewBtn active" data-letter="A">A</button><button class="viewBtn" data-letter="B">B</button><button class="viewBtn" data-letter="C">C</button><button class="viewBtn" data-letter="D">D</button></div><div class="question">哪一張最容易看出品質較差？</div><div class="answerGrid"><button class="ans" data-answer="A">A</button><button class="ans" data-answer="B">B</button><button class="ans" data-answer="C">C</button><button class="ans" data-answer="D">D</button><button class="ans none" data-answer="分不出">分不出</button></div><div class="actions"><button class="btn" id="back" disabled>上一組</button><button class="btn primary" id="next" disabled>下一組</button></div></section>
<div class="note" id="note">同一組的 A–D 最後都映射到相同實際顯示尺寸；差別只在前段代理解析度。請不要縮放圖片。螢幕亮度用你平常修圖的習慣即可。這輪不測 P3 / HDR。</div>
<section class="results" id="results" hidden><h2>完成</h2><pre id="summary"></pre><button class="btn primary" id="copy">複製結果</button><div class="small" id="deviceInfo"></div></section>
</main><script>
'use strict';
const VERSION='KQ-PROXY-R1-v0.1',SOURCE_W=2400,SOURCE_H=1600;
const CONDITIONS=[{id:'Tone_Light',family:'tone',surround:'light',label:'Tone · Light',map:{A:'p125',B:'p960',C:'p150',D:'p100'}},{id:'Tone_Dark',family:'tone',surround:'dark',label:'Tone · Dark',map:{A:'p100',B:'p150',C:'p960',D:'p125'}},{id:'Detail_Light',family:'detail',surround:'light',label:'Detail · Light',map:{A:'p150',B:'p100',C:'p125',D:'p960'}},{id:'Detail_Dark',family:'detail',surround:'dark',label:'Detail · Dark',map:{A:'p960',B:'p125',C:'p100',D:'p150'}}];
const $=id=>document.getElementById(id),stage=$('stage'),stageWrap=$('stageWrap'),loading=$('loading'),conditionEl=$('condition'),progressEl=$('progress'),nextBtn=$('next'),backBtn=$('back'),results=$('results'),summaryEl=$('summary'),deviceInfo=$('deviceInfo');let index=0,currentLetter='A',answers={},familyCache=null,familyCacheName=null,targetW=0,targetH=0,dpr=window.devicePixelRatio||1,touchStartX=null;
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}function smoothing(x){x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high'}
function buildToneScene(){const c=makeCanvas(SOURCE_W,SOURCE_H),x=c.getContext('2d'),g=x.createLinearGradient(0,0,SOURCE_W,SOURCE_H);g.addColorStop(0,'rgb(52,41,38)');g.addColorStop(.34,'rgb(151,111,91)');g.addColorStop(.68,'rgb(194,171,145)');g.addColorStop(1,'rgb(72,101,132)');x.fillStyle=g;x.fillRect(0,0,SOURCE_W,SOURCE_H);for(const [cx,cy,r,col] of [[.28,.38,.24,'rgba(255,190,152,.30)'],[.70,.60,.32,'rgba(79,117,171,.22)'],[.54,.24,.15,'rgba(255,137,91,.20)'],[.40,.74,.22,'rgba(255,226,191,.12)']]){const q=x.createRadialGradient(cx*SOURCE_W,cy*SOURCE_H,0,cx*SOURCE_W,cy*SOURCE_H,r*SOURCE_W);q.addColorStop(0,col);q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.fillRect(0,0,SOURCE_W,SOURCE_H)}x.globalAlpha=.055;for(let i=0;i<34;i++){x.fillStyle=i%2?'#fff':'#000';x.fillRect(0,(i/34)*SOURCE_H,SOURCE_W,2)}x.globalAlpha=1;return c}
function buildDetailScene(){const c=makeCanvas(SOURCE_W,SOURCE_H),x=c.getContext('2d');x.fillStyle='rgb(38,42,45)';x.fillRect(0,0,SOURCE_W,SOURCE_H);x.lineWidth=1;for(let i=0;i<SOURCE_W;i+=14){const v=(Math.floor(i/14)%2)?95:220;x.strokeStyle=`rgb(${v},${v},${v})`;x.beginPath();x.moveTo(i,0);x.lineTo(SOURCE_W-i*.25,SOURCE_H);x.stroke()}x.fillStyle='rgb(88,72,64)';x.fillRect(110,130,940,590);for(let y=130;y<720;y+=6){x.strokeStyle='rgb(170,145,120)';x.beginPath();x.moveTo(110,y);x.lineTo(1050,y);x.stroke()}for(let xx=110;xx<1050;xx+=8){x.strokeStyle='rgb(56,48,44)';x.beginPath();x.moveTo(xx,130);x.lineTo(xx,720);x.stroke()}for(let k=0;k<85;k++){x.strokeStyle=`rgb(${110+(k%5)*24},${102+(k%5)*24},${94+(k%5)*24})`;x.beginPath();for(let xx=90;xx<SOURCE_W-90;xx+=20){const yy=790+k*5+38*Math.sin(xx/130+k*.12);if(xx===90)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.stroke()}['#fff','#ff281e','#1eff5a','#1e64ff','#ffe628'].forEach((col,j)=>{const xx=1350+j*130;x.fillStyle=col;x.fillRect(xx,120,3,580);x.fillStyle='#000';x.fillRect(xx+8,120,5,580)});const sx=1650,sy=830,cell=4;for(let yy=sy;yy<1250;yy+=cell)for(let xx=sx;xx<2200;xx+=cell){x.fillStyle=(((xx-sx)/cell+(yy-sy)/cell)&1)?'#121212':'#eeeeee';x.fillRect(xx,yy,cell,cell)}return c}
function applyTone(c){const x=c.getContext('2d',{willReadFrequently:true}),im=x.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4)for(let k=0;k<3;k++){let v=d[i+k]/255,y=Math.pow(v,.84);y=y+.18*(y-.5)*(1-4*(y-.5)*(y-.5));d[i+k]=Math.max(0,Math.min(255,Math.round(y*255)))}x.putImageData(im,0,0)}
function applyDetail(c){const x=c.getContext('2d',{willReadFrequently:true}),im=x.getImageData(0,0,c.width,c.height),src=new Uint8ClampedArray(im.data),d=im.data,w=c.width,h=c.height,a=.42;for(let y=1;y<h-1;y++){const row=y*w;for(let xx=1;xx<w-1;xx++){const p=(row+xx)*4;for(let k=0;k<3;k++){const center=src[p+k],nb=src[p-4+k]+src[p+4+k]+src[p-w*4+k]+src[p+w*4+k];d[p+k]=Math.max(0,Math.min(255,Math.round(center*(1+4*a)-a*nb)))}}}x.putImageData(im,0,0)}
async function buildFamily(name){loading.hidden=false;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const source=name==='tone'?buildToneScene():buildDetailScene(),widths={p960:960,p100:targetW,p125:Math.round(targetW*1.25),p150:Math.round(targetW*1.5)},out={};for(const key of Object.keys(widths)){const pw=widths[key],ph=Math.round(pw*SOURCE_H/SOURCE_W),proxy=makeCanvas(pw,ph),px=proxy.getContext('2d');smoothing(px);px.drawImage(source,0,0,pw,ph);name==='tone'?applyTone(proxy):applyDetail(proxy);const final=makeCanvas(targetW,targetH),fx=final.getContext('2d');smoothing(fx);fx.drawImage(proxy,0,0,targetW,targetH);out[key]=final;await new Promise(r=>setTimeout(r,0))}familyCache=out;familyCacheName=name;loading.hidden=true}
function updateTargetSize(){const cssW=Math.max(320,Math.round(stageWrap.getBoundingClientRect().width));dpr=window.devicePixelRatio||1;targetW=Math.round(cssW*dpr);targetH=Math.round(targetW*SOURCE_H/SOURCE_W);stage.width=targetW;stage.height=targetH}
function drawLetter(letter){if(!familyCache)return;currentLetter=letter;document.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('active',b.dataset.letter===letter));const src=familyCache[CONDITIONS[index].map[letter]],x=stage.getContext('2d');x.clearRect(0,0,targetW,targetH);x.drawImage(src,0,0)}
async function showCondition(i){index=i;const c=CONDITIONS[index];conditionEl.textContent=c.label;progressEl.textContent=`${index+1} / ${CONDITIONS.length}`;stageWrap.classList.toggle('dark',c.surround==='dark');backBtn.disabled=index===0;nextBtn.textContent=index===CONDITIONS.length-1?'完成':'下一組';document.querySelectorAll('.ans').forEach(b=>b.classList.toggle('active',answers[c.id]===b.dataset.answer));nextBtn.disabled=!answers[c.id];if(familyCacheName!==c.family)await buildFamily(c.family);drawLetter('A')}
function chooseAnswer(v){answers[CONDITIONS[index].id]=v;document.querySelectorAll('.ans').forEach(b=>b.classList.toggle('active',b.dataset.answer===v));nextBtn.disabled=false}
function makeSummary(){return [VERSION,`Tone_Light: ${answers.Tone_Light||'-'}`,`Tone_Dark: ${answers.Tone_Dark||'-'}`,`Detail_Light: ${answers.Detail_Light||'-'}`,`Detail_Dark: ${answers.Detail_Dark||'-'}`,`display_estimate: ${targetW}×${targetH} px · DPR ${dpr}`,`color-gamut-p3: ${matchMedia('(color-gamut: p3)').matches?'yes':'no'}`].join('\n')}
function finish(){$('controls').hidden=true;$('note').hidden=true;stageWrap.hidden=true;results.hidden=false;summaryEl.textContent=makeSummary();deviceInfo.textContent='此結果不會自動上傳。請複製後貼回 KOKEI QA。True Tone、Night Shift、實際亮度無法由網頁可靠讀取。'}
document.querySelectorAll('.viewBtn').forEach(b=>b.addEventListener('click',()=>drawLetter(b.dataset.letter)));document.querySelectorAll('.ans').forEach(b=>b.addEventListener('click',()=>chooseAnswer(b.dataset.answer)));nextBtn.addEventListener('click',()=>index<CONDITIONS.length-1?showCondition(index+1):finish());backBtn.addEventListener('click',()=>{if(index>0)showCondition(index-1)});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(makeSummary());$('copy').textContent='已複製'}catch(e){$('copy').textContent='請長按上方結果複製'}});stage.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(touchStartX==null)return;const dx=e.changedTouches[0].clientX-touchStartX;touchStartX=null;if(Math.abs(dx)<38)return;const letters=['A','B','C','D'],p=letters.indexOf(currentLetter),n=dx<0?Math.min(3,p+1):Math.max(0,p-1);drawLetter(letters[n])},{passive:true});(async()=>{updateTargetSize();await showCondition(0)})();
</script></body></html>
