<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KOKEI Parameter Testbed v0.2.2</title>
<style>
:root{--bg:#f6f6f4;--fg:#111;--muted:#70706c;--line:#d7d7d2;--panel:#fff;--accent:#111;--danger:#a11}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{overscroll-behavior-y:none}
main{max-width:920px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 2px 12px}
h1{font-size:17px;line-height:1.2;margin:0;font-weight:680;letter-spacing:.01em}.meta{font-size:11px;color:var(--muted);text-align:right}
.stage{background:#111;border-radius:14px;min-height:55vh;display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid #202020;touch-action:manipulation}
canvas{display:block;max-width:100%;max-height:68vh;width:auto;height:auto}.empty{color:#aaa;text-align:center;padding:44px 24px;font-size:14px;line-height:1.55;max-width:430px}
.loading{position:absolute;inset:0;background:rgba(0,0,0,.78);color:#fff;display:none;place-items:center;text-align:center;padding:30px;font-size:14px;line-height:1.5;z-index:4}.stage.busy .loading{display:grid}
.controls{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}
.row{display:grid;grid-template-columns:82px 1fr 48px;gap:10px;align-items:center}.label{font-size:13px;font-weight:650}.value{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:34px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:#111;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:620;cursor:pointer;min-height:40px}.btn:disabled{opacity:.4;cursor:not-allowed}
.fileNative{display:block;width:100%;min-height:44px;font-size:13px;color:#111;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px}.fileNative::file-selector-button{appearance:none;border:0;background:#111;color:#fff;border-radius:8px;padding:10px 12px;margin-right:10px;font-size:13px;font-weight:650;cursor:pointer}
.status{margin-top:9px;font-size:12px;line-height:1.45;color:var(--muted);min-height:18px;word-break:break-word}.status.error{color:var(--danger)}
.note{margin-top:8px;color:var(--muted);font-size:10.5px;line-height:1.5;border-top:1px solid #ecece8;padding-top:8px}.module{font-size:11px;color:var(--muted);margin-bottom:10px}
@media(max-width:620px){main{padding-left:8px;padding-right:8px}.stage{min-height:52vh;border-radius:11px}.controls{border-radius:11px}.row{grid-template-columns:72px 1fr 40px;gap:7px}.meta{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}.btn{width:100%}}
</style>
</head>
<body><main>
<header><h1>KOKEI — Parameter Testbed</h1><div class="meta">v0.2.2 · HTTPS Test · local-only</div></header>
<section class="stage" id="stage"><div class="empty" id="empty">選擇一張照片開始測試。<br>照片只在你的裝置內處理，不會上傳。</div><canvas id="canvas" hidden></canvas><div class="loading" id="loading">正在讀取照片…</div></section>
<section class="controls">
<div class="module" id="moduleName">Module: C2-CO Contrast Geometry v0.1</div>
<div class="row"><div class="label">Contrast</div><input id="slider" type="range" min="-50" max="50" step="1" value="0" disabled /><div class="value" id="value">0</div></div>
<div class="actions"><input class="fileNative" id="file" type="file" accept="image/*" /><button class="btn" id="before" type="button" disabled>按住看 Before</button><button class="btn" id="reset" type="button" disabled>歸零</button><button class="btn" id="save" type="button" disabled>輸出預覽 PNG</button></div>
<div class="status" id="status">Stage 0/5 · JavaScript starting…</div>
<div class="note">C2-CO bounded visual test。照片僅在瀏覽器記憶體內處理。</div>
</section></main>
<script>
'use strict';
const KNOTS=[[0,0,0],[.05,-.07491,.02536],[.10,-.13502,.04548],[.20,-.17845,.05849],[.30,-.05341,.01793],[.34,-.01299,.00069],[.50,.29576,-.09898],[.70,.32873,-.11422],[.85,.19793,-.07050],[.95,.06655,-.02853],[1,0,0]];
const xs=KNOTS.map(k=>k[0]),yp=KNOTS.map(k=>k[1]),yn=KNOTS.map(k=>k[2]);
function slopes(ys){const n=xs.length,h=[],d=[],m=new Array(n).fill(0);for(let i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(ys[i+1]-ys[i])/h[i]}m[0]=((2*h[0]+h[1])*d[0]-h[0]*d[1])/(h[0]+h[1]);if(Math.sign(m[0])!==Math.sign(d[0]))m[0]=0;for(let i=1;i<n-1;i++){if(!d[i-1]||!d[i]||Math.sign(d[i-1])!==Math.sign(d[i]))m[i]=0;else{const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);}}const k=n-1;m[k]=((2*h[k-1]+h[k-2])*d[k-1]-h[k-1]*d[k-2])/(h[k-1]+h[k-2]);if(Math.sign(m[k])!==Math.sign(d[k-1]))m[k]=0;return m;}
const mp=slopes(yp),mn=slopes(yn);
function pchip(x,ys,ms){x=Math.min(1,Math.max(0,x));let i=xs.length-2;for(let j=0;j<xs.length-1;j++){if(x<=xs[j+1]){i=j;break}}const h=xs[i+1]-xs[i],t=(x-xs[i])/h,t2=t*t,t3=t2*t;return(2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h*ms[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h*ms[i+1];}
function transformY(x,c){if(c===0)return x;const u=Math.max(-.5,Math.min(.5,c/100)),m=Math.abs(u),basis=u>=0?pchip(x,yp,mp):pchip(x,yn,mn);return Math.max(0,Math.min(1,x+m*basis));}
function process(data,value){if(value===0)return data;const LUT_SIZE=1024,lut=new Float32Array(LUT_SIZE);for(let i=0;i<LUT_SIZE;i++)lut[i]=transformY(i/(LUT_SIZE-1),value);for(let i=0;i<data.length;i+=4){const r=data[i]/255,g=data[i+1]/255,b=data[i+2]/255;const y=.2126*r+.7152*g+.0722*b,idx=Math.max(0,Math.min(LUT_SIZE-1,Math.round(y*(LUT_SIZE-1)))),yy=lut[idx];if(y<1e-6){const q=Math.round(yy*255);data[i]=data[i+1]=data[i+2]=q;continue}const s=yy/y;data[i]=Math.max(0,Math.min(255,Math.round(r*s*255)));data[i+1]=Math.max(0,Math.min(255,Math.round(g*s*255)));data[i+2]=Math.max(0,Math.min(255,Math.round(b*s*255)));}return data;}
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),file=$('file'),slider=$('slider'),valueEl=$('value'),before=$('before'),reset=$('reset'),save=$('save'),stage=$('stage'),empty=$('empty'),status=$('status'),loading=$('loading');let original=null,showingBefore=false,isRendering=false,lastRenderedValue=0;
function setStatus(t,e=false){status.textContent=t;status.classList.toggle('error',e)}function busy(on,t='正在讀取照片…'){stage.classList.toggle('busy',on);loading.textContent=t}function enable(on){slider.disabled=before.disabled=reset.disabled=save.disabled=!on}
setStatus('Stage 0/5 · JavaScript ACTIVE · HTTPS host ready.');
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;loadFile(f)});
async function loadFile(f){busy(true,'正在解碼照片…');enable(false);try{setStatus('Stage 2/5 · File received · '+f.name);const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Image decode failed'));im.src=url});setStatus('Stage 3/5 · Decode PASS · '+img.naturalWidth+'×'+img.naturalHeight);const maxPixels=/iPhone|iPad|iPod/i.test(navigator.userAgent)?800000:1800000,scale=Math.min(1,Math.sqrt(maxPixels/(img.naturalWidth*img.naturalHeight))),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);setStatus('Stage 4/5 · Canvas PASS · '+w+'×'+h);original=ctx.getImageData(0,0,w,h);setStatus('Stage 5/5 · Pixel readback PASS · Ready');canvas.hidden=false;empty.hidden=true;enable(true);ctx.putImageData(original,0,0);}catch(e){setStatus('FAILED · '+e.message,true)}finally{busy(false)}}
function render(){if(!original||isRendering)return;const v=Number(slider.value);if(showingBefore||v===0){ctx.putImageData(original,0,0);lastRenderedValue=v;return}isRendering=true;requestAnimationFrame(()=>{const copy=new Uint8ClampedArray(original.data);process(copy,v);ctx.putImageData(new ImageData(copy,original.width,original.height),0,0);isRendering=false;lastRenderedValue=v;if(Number(slider.value)!==v&&!showingBefore)render();});}
slider.addEventListener('input',()=>{valueEl.textContent=slider.value;render()});reset.addEventListener('click',()=>{slider.value=0;valueEl.textContent='0';render()});before.addEventListener('pointerdown',e=>{e.preventDefault();showingBefore=true;ctx.putImageData(original,0,0)});['pointerup','pointercancel','pointerleave'].forEach(ev=>before.addEventListener(ev,()=>{showingBefore=false;render()}));save.addEventListener('click',()=>canvas.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='KOKEI_C2CO_'+slider.value+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png'));
</script></body></html>
